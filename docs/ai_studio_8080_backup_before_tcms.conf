# ============================================================
# 備份：加入 TCMS 前的原始 Nginx 設定
# 來源：/etc/nginx/sites-enabled/ai_studio_8080
# 還原指令：sudo cp kk_tcms_1.5/docs/ai_studio_8080_backup_before_tcms.conf /etc/nginx/sites-enabled/ai_studio_8080
#          sudo nginx -t && sudo systemctl reload nginx
# ============================================================

server {
    listen 8081;
    server_name autotest-service.sit.kkday.com;
    charset utf-8;

    client_max_body_size 150M;

    # ========================================================
    # V1: AI STUDIO 專案設定 (Container: 19422)
    # ========================================================

    # 修正沒有結尾斜線時自動導向
    location = /ai_studio {
        return 301 /ai_studio/dashboard;
    }
   
    location = /ai_studio/ {
        return 301 /ai_studio/dashboard;
    }
 
    location = /dashboard {
        return 301 /ai_studio/dashboard;
    }
  
    location = /tasks-history {
        return 301 /ai_studio/tasks-history;
    }
    
    location = /apitest {
        return 301 /ai_studio/apitest;
    }

    location = /loadtest {
        return 301 /ai_studio/loadtest;
    }

    location = /coverage {
        return 301 /ai_studio/coverage;
    }

    location = /release-impact {
        return 301 /ai_studio/release-impact;
    }

    location = /api-change-tracker {
        return 301 /ai_studio/api-change-tracker;
    }
    
    location = /consistency-auditor {
       return 301 /ai_studio/consistency-auditor;
    }
  
    # 健康檢查 (AI Studio)
    location = /ai_studio/api-health {
        proxy_pass http://127.0.0.1:19422/api-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 靜態資源 (AI Studio)
    location ^~ /ai_studio/assets/ {
        proxy_pass http://127.0.0.1:19422/ai_studio/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }	

    # FastAPI 文檔頁面 (AI Studio)
    location = /ai_studio/docs {
        proxy_pass http://127.0.0.1:19422/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI OpenAPI JSON (AI Studio)
    location = /ai_studio/openapi.json {
        proxy_pass http://127.0.0.1:19422/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI API 路由 (AI Studio)
    location ^~ /api {
        rewrite ^/ai_studio(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:19422;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (AI Studio)
    location ^~ /ai_studio/ {
        proxy_pass http://127.0.0.1:19422/ai_studio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_redirect off;
    }


    # ========================================================
    # V2: ISSUE ANALYST 專案設定 (Frontend: 8083, Backend: 19423)
    # ========================================================

    # 直接導向到子路徑
    location /team-detail {
        return 301 /issue_analyst/team-detail$is_args$args;
    }

    # 自動補上斜線
    location = /issue_analyst {
        return 301 /issue_analyst/;
    }

    # 健康檢查 (Issue Analyst) -> Port 19423
    location = /issue_analyst/api-health {
        proxy_pass http://127.0.0.1:19423/api-health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 靜態資源 (Issue Analyst) -> Port 8083
    location ^~ /issue_analyst/assets/ {
        proxy_pass http://127.0.0.1:8083/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # FastAPI 文檔頁面 (Issue Analyst) -> Port 19423
    location = /issue_analyst/docs {
        proxy_pass http://127.0.0.1:19423/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI OpenAPI JSON (Issue Analyst) -> Port 19423
    location = /issue_analyst/openapi.json {
        proxy_pass http://127.0.0.1:19423/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI API 路由 (Issue Analyst) -> Port 19423
    location ^~ /issue_analyst/api {
        rewrite ^/issue_analyst(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:19423;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (Issue Analyst) -> Port 8083 (Frontend)
    location ^~ /issue_analyst/ {
        rewrite ^/issue_analyst/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
