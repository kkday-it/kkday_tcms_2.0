# EC2 / 生產環境：使用 remote DB（get_secret key=qa_database）
# 部署前：cp backend/.env.example backend/.env，填入 SECRET_SERVICE_URL、AUTOMATION_TOKEN
# 本機開發：在 .env 設 USE_LOCAL_DB=true 並提供 DATABASE_URL（即 .env.example 預設）

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcms_backend
    restart: always
    env_file:
      - backend/.env
    environment:
      - USE_LOCAL_DB=false
      # Google OAuth 2.0 - override in backend/.env for local; defaults work for EC2
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-268197566244-5ckrn0agou350fqajumm8oi6etpipvi5.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_OAUTH_REDIRECT_URI=${GOOGLE_OAUTH_REDIRECT_URI:-http://autotest-service.sit.kkday.com:8081/tcms/api/v1/users/google-oauth/callback}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-/tcms/}
    volumes:
      - tcms_data:/app/data
      - tcms_uploads:/app/uploads
      - tcms_logs:/app/logs
    ports:
      - "19425:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 掛在 /tcms 時：建立 kk_tcms_1.5/.env 含 VITE_API_URL=/tcms/api/v1 VITE_BASE_URL=/tcms/
        VITE_API_URL: ${VITE_API_URL:-/tcms/api/v1}
        VITE_BASE_URL: ${VITE_BASE_URL:-/tcms/}
    container_name: tcms_frontend
    restart: always
    ports:
      - "8085:80"
    volumes:
      - tcms_logs:/var/log/nginx
    depends_on:
      - backend

volumes:
  tcms_data:
  tcms_uploads:
  tcms_logs:  # FE nginx + BE uvicorn 共用，供 tcms/fe-log、tcms/be-log 使用
