# 單一容器：前端(Vite build) 併入後端 image，由 FastAPI 一起 serve（見 root Dockerfile）。
# 生產(掛 /tcms)：直接 `docker compose up -d --build`（VITE/ROOT_PATH 預設即 /tcms）。
# 本機直連 port 測試（不掛 /tcms、開 http://localhost:8085/）：
#   VITE_API_URL=/api/v1 VITE_BASE_URL=/ ROOT_PATH= FRONTEND_BASE_URL=/ \
#     docker compose up -d --build
# 隔離 DB（自帶 postgres，不連 remote qa_database）：
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/tcms/api/v1}
        VITE_BASE_URL: ${VITE_BASE_URL:-/tcms/}
    container_name: tcms_app
    restart: always
    env_file:
      - backend/.env
    environment:
      # remote qa_database（EC2/生產）；OAuth 等 secret 從 backend/.env 載入
      - USE_LOCAL_DB=false
      - ROOT_PATH=${ROOT_PATH-/tcms}
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-/tcms/}
    volumes:
      - tcms_data:/app/data
      - tcms_uploads:/app/uploads
      - tcms_logs:/app/logs
    ports:
      # host nginx 的 /tcms 指向此 port 即可（前端 + API 同一 port）
      - "8085:8000"

volumes:
  tcms_data:
  tcms_uploads:
  tcms_logs:
