version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcms_backend
    restart: always
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/tcms_1_5.db
    volumes:
      - tcms_data:/app/data
      - tcms_uploads:/app/uploads
    ports:
      - "19425:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tcms_frontend
    restart: always
    ports:
      - "8085:80"
    depends_on:
      - backend

volumes:
  tcms_data:
  tcms_uploads:
