# EC2 / 生產環境：使用 remote DB（get_secret key=qa_database）
# 部署前：cp backend/.env.example backend/.env，填入 SECRET_SERVICE_URL、AUTOMATION_TOKEN
# 本機開發：在 .env 設 USE_QA_DATABASE_SECRET=false 並提供 DATABASE_URL

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tcms_backend
    restart: always
    env_file:
      - backend/.env
    environment:
      - USE_QA_DATABASE_SECRET=true
    volumes:
      - tcms_data:/app/data
      - tcms_uploads:/app/uploads
      - tcms_logs:/app/logs
    ports:
      - "19425:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # 掛在 /tcms 時：建立 kk_tcms_1.5/.env 含 VITE_API_URL=/tcms/api/v1 VITE_BASE_URL=/tcms/
        VITE_API_URL: ${VITE_API_URL:-/tcms/api/v1}
        VITE_BASE_URL: ${VITE_BASE_URL:-/tcms/}
    container_name: tcms_frontend
    restart: always
    ports:
      - "8085:80"
    volumes:
      - tcms_logs:/var/log/nginx
    depends_on:
      - backend

volumes:
  tcms_data:
  tcms_uploads:
  tcms_logs:  # FE nginx + BE uvicorn 共用，供 tcms/fe-log、tcms/be-log 使用
